name: domain-watch

on:
  schedule:
    - cron: "23 11 * * *"  # every day at 11:23 UTC
  workflow_dispatch:

permissions:
  contents: write  # commit state/ and STATUS.md
  issues: write    # open the alert issue

concurrency:
  group: domain-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check domains
        run: python domain_watch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state STATUS.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update domain state"
            git push
          fi
